# CFDP Class 2 闭环审计编排
#   web    —— 常驻 HTTP 服务（宿主端口可用 WEB_PORT 覆盖，默认 8080）
#   verify —— 一次性验收服务：构建检查 → 服务健康 → HTTP 完整闭环冒烟
#             → 缺段修复/冲突重传等代码测试；执行后退出并以退出码报告结果。
#
# 验收:  docker compose up --build --abort-on-container-exit --exit-code-from verify
services:
  web:
    build: .
    image: cfdp-class2-auditor:latest
    environment:
      CFDP_AUDIT_HOST: 0.0.0.0
      CFDP_AUDIT_PORT: 8080
    ports:
      # 宿主端口可通过 WEB_PORT 配置，容器内固定 8080
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3); sys.exit(0 if r.status==200 and json.loads(r.read())['status']=='ok' else 1)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  verify:
    build: .
    image: cfdp-class2-auditor:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_BASE_URL: http://web:8080
    entrypoint: ["/bin/sh", "verify.sh"]
    restart: "no"
